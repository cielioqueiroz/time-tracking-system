# ─────────────────────────────────────────────────────────────────────────
#  Base configuration (shared by all profiles).
#  Environment-specific values live in application-{dev,prod}.yml.
# ─────────────────────────────────────────────────────────────────────────
spring:
  application:
    name: time-tracking-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

# ───────────── Application-specific settings ─────────────
application:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-256-bits-long-secret}
      expiration: ${JWT_EXPIRATION:86400000}   # 24h in ms

# ───────────── OpenAPI / Swagger ─────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# ───────────── Actuator ─────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
