name: time_tracking
description: Enterprise Time Tracking System — Flutter client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Typography (Manrope + JetBrains Mono)
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0

  # Web platform interop (CSV download) — the app targets Flutter web
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
